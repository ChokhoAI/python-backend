services:
  - type: web
    name: chokho-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000 --workers 1 --timeout-keep-alive 5 --timeout-notify 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.9
    healthCheckPath: /health
    timeout: 300  # 5 minute timeout for startup
